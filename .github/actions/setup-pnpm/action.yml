name: Setup pnpm
description: Node from .nvmrc, pnpm from packageManager via Corepack, and frozen lockfile dependencies
runs:
  using: composite
  steps:
    # No pnpm store cache: restoring the ~230 MB store took longer than a fresh
    # frozen install from the registry on GitHub-hosted runners.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
    - run: corepack enable pnpm && pnpm --version
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    - run: pnpm install --frozen-lockfile
      shell: bash
