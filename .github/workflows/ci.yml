name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm security:check
      - run: pnpm qa
      - run: pnpm eval:offline
      # test already built the MCP App bundle; build only the Next.js app.
      - run: pnpm --filter web exec next build --webpack
