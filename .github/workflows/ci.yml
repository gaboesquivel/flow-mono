name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Draft runs skip in their own group so a late one never cancels the ready run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Drafts run nothing; ready_for_review and later pushes run it (spec 048).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm security:check
      - run: pnpm qa
      # Evals run on demand only (`pnpm eval`), never in CI.
      # test already built the MCP App bundle; build only the Next.js app.
      - run: pnpm --filter web exec next build --webpack
